version: 2

models:
  - name: dim_users
    description: "Customer dimension"
    columns:
      - name: user_id
        description: "Primary key"
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product dimension"
    columns:
      - name: product_id
        description: "Primary key"
        tests:
          - unique
          - not_null

  - name: dim_orders
    description: "Order dimension"
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null

  - name: dim_distribution_centers
    description: "Distribution center dimension"
    columns:
      - name: distribution_center_id
        description: "Primary key"
        tests:
          - unique
          - not_null

  - name: fct_order_items
    description: "Fact table, grain = one sold item"
    columns:
      - name: order_item_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_orders')
              field: order_id